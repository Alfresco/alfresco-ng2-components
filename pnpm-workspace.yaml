packages:
  - 'lib/eslint-angular'

# Block packages published less than 3 days ago (4320 minutes)
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

overrides:
  # Security fixes
  "minimatch@10.2.5": "10.2.6"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  serialize-javascript: '>=7.0.5'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.25'
  webpack-dev-server: '>=6.0.0'
  uuid: '>=11.1.1'
  undici: 8.12.2
  smol-toml: 1.9.0
  piscina: 5.3.2
  proxy-addr: 2.0.8
  '@storybook/builder-webpack5>webpack-dev-middleware': 7.4.5
  fast-uri: 3.1.8
  shell-quote: 1.11.0
  source-map-js: 1.2.2
  compression: 1.8.2
  postcss-selector-parser: 7.1.6
  'follow-redirects@<1.16.1': 1.16.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  sharp: true
  node-sass: true
  sass: true
  pdfjs-dist: true
  canvas: true
  bcrypt: true
  sqlite3: true
  better-sqlite3: true
  puppeteer: true
  playwright: true
  fsevents: true
  husky: true
  core-js: true
  core-js-pure: true
  '@esbuild/darwin-arm64': true
  '@esbuild/darwin-x64': true
  '@esbuild/linux-x64': true
  '@esbuild/win32-x64': true
  '@nx/nx-darwin-arm64': true
  '@nx/nx-darwin-x64': true
  '@nx/nx-linux-x64-gnu': true
  '@nx/nx-linux-x64-musl': true
  '@nx/nx-win32-x64-msvc': true
  '@swc/core': true
  less: true

packages:
  - 'lib/eslint-angular'

# Block packages published less than 3 days ago (4320 minutes)
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

overrides:
  # Security fixes
  "minimatch@10.2.5": "10.2.6"
  serialize-javascript: '>=7.0.5'
  picomatch: '>=4.0.4'
  postcss: '>=8.5.25'
  webpack-dev-server: '>=6.0.0'
  uuid: '>=11.1.1'
  undici: 8.10.2
  smol-toml: 1.8.0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  sharp: true
  node-sass: true
  sass: true
  pdfjs-dist: true
  canvas: true
  bcrypt: true
  sqlite3: true
  better-sqlite3: true
  puppeteer: true
  playwright: true
  fsevents: true
  husky: true
  core-js: true
  core-js-pure: true
  '@esbuild/darwin-arm64': true
  '@esbuild/darwin-x64': true
  '@esbuild/linux-x64': true
  '@esbuild/win32-x64': true
  '@nx/nx-darwin-arm64': true
  '@nx/nx-darwin-x64': true
  '@nx/nx-linux-x64-gnu': true
  '@nx/nx-linux-x64-musl': true
  '@nx/nx-win32-x64-msvc': true
  '@swc/core': true
  less: true

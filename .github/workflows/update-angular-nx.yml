name: "🚀 Update Angular and Nx"

on:
  workflow_dispatch:
    inputs:
      angular-major:
        description: "Target Angular major version (must be the next major, e.g. 22)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: "--max-old-space-size=5120"

permissions:
  contents: read

jobs:
  prepare:
    name: "🌱 Prepare update branch"
    # if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      branch: ${{ steps.prepare.outputs.branch }}
      version: ${{ steps.prepare.outputs.version }}
      base-sha: ${{ steps.prepare.outputs.base-sha }}
      releases-as-of: ${{ steps.releases.outputs.created-at }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          full-setup: 'false'
      - name: Pin release resolution
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          CREATED_AT=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.created_at')
          echo "UPDATE_ANGULAR_RELEASES_AS_OF=$CREATED_AT" >> "$GITHUB_ENV"
          echo "created-at=$CREATED_AT" >> "$GITHUB_OUTPUT"
      - name: Configure git identity
        uses: ./.github/actions/update-angular/configure-git-identity
        with:
          git-user: ${{ vars.HXPS_GIT_USERNAME }}
          git-email: ${{ vars.HXPS_GIT_EMAIL }}
      - name: Prepare branch
        id: prepare
        uses: ./.github/actions/update-angular/prepare-branch
        with:
          angular-major: ${{ inputs.angular-major }}
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
      - name: Sign and push branch
        uses: ./.github/actions/update-angular/push-branch
        with:
          branch: ${{ steps.prepare.outputs.branch }}
          github-token: ${{ steps.app-token.outputs.token }}
          gpg-private-key: ${{ secrets.HXPS_GIT_COMMIT_SIGNING_PRIVATE_KEY }}

  update-nx:
    name: "Update Nx"
    needs: [prepare]
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: update-nx
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  update-angular:
    name: "Update Angular packages"
    needs: [prepare, update-nx]
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: update-angular-packages
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  align-peers:
    name: "Align peer dependencies"
    needs: [prepare, update-angular]
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: align-peers
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  run-migrations:
    name: "Run migrations"
    needs: [prepare, align-peers]
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: run-migrations
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  format-and-check:
    name: "Format and check dependencies"
    needs: [prepare, run-migrations]
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: format-and-check
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  clean-overrides:
    name: "Clean overrides"
    needs: [prepare, format-and-check]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.format-and-check.result == 'success' || (needs.format-and-check.result == 'failure' && needs.format-and-check.outputs.lockfile-outcome == 'success')) }}
    uses: ./.github/workflows/update-angular-stage.yml
    secrets: inherit
    with:
      stage: clean-overrides
      branch: ${{ needs.prepare.outputs.branch }}
      angular-major: ${{ inputs.angular-major }}
      version: ${{ needs.prepare.outputs.version }}
      releases-as-of: ${{ needs.prepare.outputs.releases-as-of }}

  migration-report:
    name: "Migration report"
    needs: [prepare, update-nx, update-angular, align-peers, run-migrations, format-and-check, clean-overrides]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download migration reports
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: migration-data-*
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Create migration report
        uses: ./.github/actions/update-angular/create-report
        with:
          base-sha: ${{ needs.prepare.outputs.base-sha }}

  build:
    name: "🏗️ Build"
    needs: [prepare, clean-overrides]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          persist-credentials: false
      - name: Build all libs
        uses: ./.github/actions/update-angular/validate
        with:
          name: build
          command: pnpm nx run-many -t build --configuration=production --exclude=stories --skip-nx-cache

  lint:
    name: "🔍 Lint"
    needs: [prepare, clean-overrides]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          persist-credentials: false
      - name: Lint all projects
        uses: ./.github/actions/update-angular/validate
        with:
          name: lint
          command: pnpm nx run-many -t lint --skip-nx-cache

  test-matrix:
    name: "🧪 Test matrix"
    needs: [prepare, clean-overrides]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          persist-credentials: false
      - name: List test projects
        id: projects
        uses: ./.github/actions/update-angular/list-test-projects

  unit-tests:
    name: "🎯 Test ${{ matrix.project }}"
    needs: [prepare, clean-overrides, test-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.test-matrix.outputs.matrix) }}
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          persist-credentials: false
      - name: Run unit tests
        uses: ./.github/actions/update-angular/validate
        with:
          name: test-${{ matrix.project }}
          command: xvfb-run --auto-servernum pnpm nx run ${{ matrix.project }}:test --skip-nx-cache

  pull-request:
    name: "🔀 Open pull request"
    needs: [prepare, update-nx, update-angular, align-peers, run-migrations, format-and-check, clean-overrides, migration-report, build, lint, test-matrix, unit-tests]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ENGINEERING_CONTRIB_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_ENGINEERING_CONTRIB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download migration report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: migration-report
          path: report
      - name: Download overrides report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: overrides-report
          path: report
      - name: Download peer report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: peer-report
          path: report
      - name: Download validation results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: validation-*
          path: validation
          merge-multiple: true
      - name: Create pull request
        uses: ./.github/actions/update-angular/create-pull-request
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          branch: ${{ needs.prepare.outputs.branch }}
          version: ${{ needs.prepare.outputs.version }}
          job-results: ${{ join(needs.*.result, ' ') }}

name: "Update Angular packages"
description: "Bump every Angular package to the target major and regenerate the lockfile"
inputs:
  angular-major:
    description: "Target Angular major version"
    required: true
  version:
    description: "Resolved @angular/core version, used in the commit message"
    required: true
runs:
  using: "composite"
  steps:
    - name: Update Angular packages
      id: stage
      shell: bash
      env:
        TARGET_MAJOR: ${{ inputs.angular-major }}
        VERSION: ${{ inputs.version }}
      run: scripts/update-angular/update-angular-packages.sh "$TARGET_MAJOR" "$VERSION" 2>&1 | tee "$RUNNER_TEMP/validation.log"
    - name: Record result
      if: ${{ always() }}
      uses: ./.github/actions/update-angular/record-validation-result
      with:
        name: update-angular-packages
        outcome: ${{ steps.stage.outcome }}
    - name: Check available releases
      id: available
      if: ${{ always() }}
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/missing-releases.log" ]; then
          cp "$RUNNER_TEMP/missing-releases.log" "$RUNNER_TEMP/validation.log"
          if [ -s "$RUNNER_TEMP/missing-releases.log" ]; then
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          fi
        fi
    - name: Record available releases
      if: ${{ always() && steps.available.outputs.outcome != '' }}
      uses: ./.github/actions/update-angular/record-validation-result
      with:
        name: available-releases
        outcome: ${{ steps.available.outputs.outcome }}

name: "Push branch"
description: "Commit what is left in the working tree, sign the commits that are not pushed yet, and push the branch. This is the only place where the signing key and a token with write access are used."
inputs:
  branch:
    description: "Branch with the update"
    required: true
  github-token:
    description: "Token allowed to push the branch"
    required: true
  gpg-private-key:
    description: "Private key used to sign the commits"
    required: true
  base-branch:
    description: "Branch the update started from"
    required: false
    default: develop
runs:
  using: "composite"
  steps:
    - name: Commit what is left
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: |
        git add -A
        git diff --cached --quiet || git commit -m "chore: save the progress of an update that did not complete"
        if git rev-parse --verify --quiet "refs/remotes/origin/$BASE_BRANCH" > /dev/null && [ "$(git rev-list --count "origin/$BASE_BRANCH..HEAD")" = "0" ]; then
          git commit --allow-empty -m "chore: start of an update that did not complete"
        fi
    - name: Sign the commits that are not pushed yet
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        GPG_KEY: ${{ inputs.gpg-private-key }}
      run: |
        echo "$GPG_KEY" | gpg --batch --import
        git config user.signingkey "$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
        UPSTREAM="origin/$BASE_BRANCH"
        if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" > /dev/null; then
          UPSTREAM="origin/$BRANCH"
        fi
        git rebase --force-rebase --gpg-sign "$UPSTREAM"
    - name: Push
      shell: bash
      env:
        BRANCH: ${{ inputs.branch }}
        TOKEN: ${{ inputs.github-token }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: git push "https://x-access-token:${TOKEN}@${SERVER_URL#https://}/${REPOSITORY}.git" "$BRANCH:refs/heads/$BRANCH"

name: "Create pull request"
description: "Open the update pull request, or update it when a re-run of the workflow resumed the branch, as a draft when validation did not fully pass"
inputs:
  github-token:
    description: "Token allowed to open pull requests"
    required: true
  branch:
    description: "Branch with the update"
    required: true
  version:
    description: "Angular version the update moves to"
    required: true
  job-results:
    description: "Space separated results of the validation jobs"
    required: true
  base-branch:
    description: "Branch the pull request targets"
    required: false
    default: develop
runs:
  using: "composite"
  steps:
    - name: Create or update pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
        VERSION: ${{ inputs.version }}
        JOB_RESULTS: ${{ inputs.job-results }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: scripts/update-angular/create-pull-request.sh

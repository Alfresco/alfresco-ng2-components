name: "Plan resume"
description: "Pin the releases the job resolves to the creation of the run and, on a re-run, find out from the earlier attempts of the run whether it created the update branch, and which stages already passed on it"
inputs:
  github-token:
    description: "Token allowed to read the jobs of the workflow run"
    required: true
outputs:
  resume:
    description: "true when an earlier attempt of this run created the branch, so this attempt continues it"
    value: ${{ steps.plan.outputs.resume }}
  done:
    description: "JSON list of the stages that passed in an earlier attempt, skipped only when the branch is really resumed"
    value: ${{ steps.plan.outputs.done }}
  version:
    description: "Version saved in the resume state of the latest attempt, empty when the state is not used"
    value: ${{ steps.plan.outputs.version }}
  base-sha:
    description: "Base commit saved in the resume state of the latest attempt, empty when the state is not used"
    value: ${{ steps.plan.outputs.base-sha }}
runs:
  using: "composite"
  steps:
    - name: Plan resume
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        JOBS="$RUNNER_TEMP/previous-attempts-jobs.jsonl"
        : > "$JOBS"
        for ((ATTEMPT = 1; ATTEMPT < RUN_ATTEMPT; ATTEMPT++)); do
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs?per_page=100" --jq '.jobs[] | tojson' >> "$JOBS"
        done
        node scripts/update-angular/plan-resume.mjs "$JOBS" "$RUNNER_TEMP/resume-state" > "$RUNNER_TEMP/resume-plan"
        echo "Attempt $RUN_ATTEMPT of the run:"
        cat "$RUNNER_TEMP/resume-plan"
        cat "$RUNNER_TEMP/resume-plan" >> "$GITHUB_OUTPUT"
        # Every later step of the job resolves releases as of the creation of the run, the same for all its attempts.
        CREATED_AT=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" --jq '.created_at')
        echo "Releases are resolved as of $CREATED_AT"
        echo "UPDATE_ANGULAR_RELEASES_AS_OF=$CREATED_AT" >> "$GITHUB_ENV"

name: 'Record validation result'
description: 'Store the outcome and an excerpt of the log of a validation step as an artifact, and the full log when the step did not succeed'
inputs:
  name:
    description: 'Name of the check'
    required: true
  outcome:
    description: 'Outcome of the validated step'
    required: true
runs:
  using: "composite"
  steps:
    - name: Write result
      id: write
      shell: bash
      env:
        CHECK_NAME: ${{ inputs.name }}
        OUTCOME: ${{ inputs.outcome }}
      run: |
        SAFE_NAME="${CHECK_NAME//\//-}"
        RESULTS="$RUNNER_TEMP/validation-results"
        mkdir -p "$RESULTS"
        echo "$OUTCOME" > "$RESULTS/$SAFE_NAME.status"
        if [ -f "$RUNNER_TEMP/validation.log" ]; then
          CLEAN_LOG="$RUNNER_TEMP/validation-clean.log"
          sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/validation.log" | perl -0pe '
            s/-----BEGIN PGP PRIVATE KEY BLOCK-----.*?-----END PGP PRIVATE KEY BLOCK-----/[redacted PGP private key]/gs;
            s/\b(?:gh[pousr]_|github_pat_|npm_)[A-Za-z0-9_]{20,}/[redacted token]/g;
            s/x-access-token:[^@\s]+@/x-access-token:[redacted]@/g;
            s/(AUTHORIZATION:\s*basic\s+)\S+/$1\[redacted]/gi;
          ' > "$CLEAN_LOG"
          {
            if grep -qE 'error|Error|ERROR|✖|FAIL' "$CLEAN_LOG"; then
              echo "Errors found in the full log (last 40 matching lines):"
              grep -nE 'error|Error|ERROR|✖|FAIL' "$CLEAN_LOG" | tail -n 40 | cut -c1-300 | head -c 3500
              echo
              echo
            fi
            echo "End of the log (last 60 lines):"
            tail -n 60 "$CLEAN_LOG" | cut -c1-300 | tail -c 2000
          } > "$RESULTS/$SAFE_NAME.log"
        fi
        echo "safe-name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
    - name: Upload result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-${{ steps.write.outputs.safe-name }}
        path: ${{ runner.temp }}/validation-results
        retention-days: 7
    - name: Upload full log
      if: ${{ inputs.outcome != 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: full-log-${{ steps.write.outputs.safe-name }}
        path: ${{ runner.temp }}/validation-clean.log
        if-no-files-found: ignore
        retention-days: 7

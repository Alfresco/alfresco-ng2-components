name: 'Record validation result'
description: 'Store the outcome and an excerpt of the log of a validation step as an artifact, and the full log when the step did not succeed'
inputs:
  name:
    description: 'Name of the check'
    required: true
  outcome:
    description: 'Outcome of the validated step'
    required: true
  sha:
    description: 'Commit the check ran on, so that the pull request can reject results of an older commit'
    required: false
    default: ''
runs:
  using: "composite"
  steps:
    - name: Write result
      id: write
      shell: bash
      env:
        CHECK_NAME: ${{ inputs.name }}
        OUTCOME: ${{ inputs.outcome }}
        SHA: ${{ inputs.sha }}
      run: scripts/update-angular/record-validation-result.sh
    - name: Upload result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: validation-${{ steps.write.outputs.safe-name }}
        path: ${{ runner.temp }}/validation-results/${{ steps.write.outputs.safe-name }}
        retention-days: 30
        overwrite: true
    - name: Upload full log
      if: ${{ inputs.outcome != 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: full-log-${{ steps.write.outputs.safe-name }}
        path: ${{ runner.temp }}/validation-clean.log
        if-no-files-found: ignore
        retention-days: 30
        overwrite: true

name: "Validate"
description: "Run a check on the update branch, record its outcome for the pull request, and fail the job when the check fails"
inputs:
  name:
    description: "Name of the check, shown in the pull request"
    required: true
  command:
    description: "Shell command that runs the check"
    required: true
runs:
  using: "composite"
  steps:
    - name: Setup environment
      uses: ./.github/actions/setup
      with:
        full-setup: 'false'
    - name: Read checked commit
      id: head
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Run check
      id: check
      shell: bash
      continue-on-error: true
      env:
        COMMAND: ${{ inputs.command }}
      run: bash -c "$COMMAND" 2>&1 | tee "$RUNNER_TEMP/validation.log"
    - name: Record result
      if: ${{ always() }}
      uses: ./.github/actions/update-angular/record-validation-result
      with:
        name: ${{ inputs.name }}
        outcome: ${{ steps.check.outcome }}
        sha: ${{ steps.head.outputs.sha }}
    - name: Fail when validation did not pass
      if: ${{ steps.check.outcome == 'failure' }}
      shell: bash
      run: exit 1

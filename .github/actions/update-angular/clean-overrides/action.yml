name: "Clean overrides"
description: "Remove the pnpm overrides that are no longer needed after the packages bump"
runs:
  using: "composite"
  steps:
    - name: Resolve dependencies without overrides
      shell: bash
      run: |
        FRESH="$RUNNER_TEMP/fresh-resolution"
        git worktree add --detach "$FRESH"
        node scripts/update-angular/remove-all-overrides.mjs "$FRESH/pnpm-workspace.yaml"
        rm "$FRESH/pnpm-lock.yaml"
        (cd "$FRESH" && pnpm install --lockfile-only --ignore-scripts)
    - name: Find obsolete overrides
      shell: bash
      run: |
        node scripts/update-angular/find-obsolete-overrides.mjs pnpm-workspace.yaml "$RUNNER_TEMP/fresh-resolution/pnpm-lock.yaml" "$RUNNER_TEMP/override-decisions.json"
    - name: Remove obsolete overrides
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/overrides-report"
        node scripts/update-angular/remove-obsolete-overrides.mjs pnpm-workspace.yaml "$RUNNER_TEMP/override-decisions.json" "$RUNNER_TEMP/overrides-report/overrides.md"
        pnpm install --lockfile-only --ignore-scripts
        git add -A
        git diff --cached --quiet || git commit -m "chore: remove obsolete pnpm overrides"
    - name: Upload overrides report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: overrides-report
        path: ${{ runner.temp }}/overrides-report
        retention-days: 7

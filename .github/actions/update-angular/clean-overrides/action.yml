name: "Clean overrides"
description: "Remove the pnpm overrides that are no longer needed after the packages bump"
runs:
  using: "composite"
  steps:
    - name: Clean overrides
      id: stage
      shell: bash
      run: scripts/update-angular/clean-overrides.sh 2>&1 | tee "$RUNNER_TEMP/validation.log"
    - name: Record result
      if: ${{ always() }}
      uses: ./.github/actions/update-angular/record-validation-result
      with:
        name: clean-overrides
        outcome: ${{ steps.stage.outcome }}
    - name: Upload overrides report
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: overrides-report
        path: ${{ runner.temp }}/overrides-report
        if-no-files-found: ignore
        retention-days: 30
        overwrite: true

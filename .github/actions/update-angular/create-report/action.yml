name: "Create migration report"
description: "Write the migration report, add it to the job summary and upload it for the pull request"
inputs:
  base-sha:
    description: "Commit the update started from"
    required: true
runs:
  using: "composite"
  steps:
    - name: Generate report
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
      run: |
        shopt -s nullglob
        mkdir -p "$RUNNER_TEMP/report"
        REPORTED=("$RUNNER_TEMP"/reported/*.json)
        node scripts/update-angular/merge-migrations.mjs "$RUNNER_TEMP/migrations.json" "${REPORTED[@]}"
        node scripts/update-angular/report-migration.mjs "$BASE_SHA" "$RUNNER_TEMP/migrations.json" > "$RUNNER_TEMP/report/migration-report.md"
        cat "$RUNNER_TEMP"/report/*.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: migration-report
        path: ${{ runner.temp }}/report
        retention-days: 7

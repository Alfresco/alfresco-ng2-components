name: "Format and check dependencies"
description: "Apply format and lint fixes, verify the lockfile, and check peer dependencies"
outputs:
  format-outcome:
    description: "Outcome of the format and lint fixes"
    value: ${{ steps.format.outputs.outcome }}
  lockfile-outcome:
    description: "Outcome of the lockfile verification"
    value: ${{ steps.lockfile.outcome }}
runs:
  using: "composite"
  steps:
    - name: Fix format and lint
      id: format
      uses: ./.github/actions/update-angular/fix-format-and-lint
    - name: Verify lockfile
      id: lockfile
      continue-on-error: true
      uses: ./.github/actions/update-angular/verify-lockfile
    - name: Check peer dependencies
      uses: ./.github/actions/update-angular/check-peers

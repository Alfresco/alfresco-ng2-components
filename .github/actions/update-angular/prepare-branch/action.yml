name: "Prepare update branch"
description: "Resolve the target Angular version and create an update branch owned by this workflow run"
inputs:
  angular-major:
    description: "Target Angular major version"
    required: true
outputs:
  version:
    description: "Resolved @angular/core version"
    value: ${{ steps.version.outputs.version }}
  branch:
    description: "Name of the created or resumed branch"
    value: ${{ steps.branch.outputs.branch }}
  base-sha:
    description: "Commit the update starts from"
    value: ${{ steps.branch.outputs.base-sha }}
runs:
  using: "composite"
  steps:
    - name: Resolve target version
      id: version
      shell: bash
      env:
        TARGET_MAJOR: ${{ inputs.angular-major }}
      run: |
        VERSION=$(node scripts/update-angular/resolve-angular-version.mjs "$TARGET_MAJOR")
        echo "Resolved @angular/core $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Create branch
      id: branch
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
        RUN_ID: ${{ github.run_id }}
      run: |
        node scripts/update-angular/prepare-branch.mjs "$VERSION" "$RUN_ID" >> "$GITHUB_OUTPUT"

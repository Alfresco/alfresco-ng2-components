<div
  class="adf-dropdown-widget {{field.className}}"
  [class.adf-invalid]="hasValidationError() && dropdownControl.touched"
  [class.adf-readonly]="field.readOnly"
  >
  <mat-form-field class="adf-form-field-input" subscriptSizing="dynamic">
    <mat-label class="adf-label" data-automation-id="adf-dropdown-widget-label">{{ field.name | translate }}</mat-label>
    <mat-select
      class="adf-select"
      data-automation-id="adf-dropdown-widget-select"
      [id]="field.id"
      [formControl]="dropdownControl"
      [errorStateMatcher]="errorStateMatcher"
      [required]="isRequired() && field.isVisible"
      >
      @for (opt of field.options; track opt) {
        <mat-option [value]="opt" [id]="opt.id">{{opt.name}}</mat-option>
      }
      @if (dropdownControl.disabled) {
        <mat-option id="readonlyOption" [value]="field.value">{{field.value}}</mat-option>
      }
    </mat-select>
    @if (!isReadOnlyField && dropdownControl.touched && hasValidationError()) {
      <mat-error class="adf-form-field-status-slot" data-automation-id="adf-dropdown-error">
        <mat-icon class="adf-error-icon">error_outline</mat-icon>
        <span class="adf-error-text">{{ field.validationSummary.message | translate }}</span>
      </mat-error>
    }
    <mat-hint class="adf-form-field-status-slot" aria-hidden="true" />
  </mat-form-field>
</div>

<mat-form-field class="adf-date-widget adf-form-field-input" subscriptSizing="dynamic" [floatLabel]="placeholder() ? 'always' : 'auto'">
    @if (label()) {
        <mat-label class="adf-label" [attr.data-automation-id]="labelAutomationId()">{{ label() }}</mat-label>
    }
    <input
        #dateText
        matInput
        [matDatepicker]="datePicker"
        [id]="inputId()"
        [min]="minDate()"
        [max]="maxDate()"
        [disabled]="locked()"
        [required]="required()"
        [placeholder]="placeholder()"
        [title]="tooltip()"
        [errorStateMatcher]="errorStateMatcher"
        (input)="typed(dateText.value)"
        (dateChange)="picked($event.value, dateText.value)"
        (blur)="markTouched()"
    />
    <mat-datepicker-toggle matIconSuffix [for]="datePicker" />
    <mat-datepicker #datePicker (closed)="markTouched()" />
    @if (error(); as message) {
        <mat-error class="adf-form-field-status-slot">
            <adf-signal-field-error [message]="message" />
        </mat-error>
    }
</mat-form-field>

<div class="adf-checkbox-widget-container" [class.adf-invalid]="showError()" [class.adf-readonly]="readOnly()">
    <mat-checkbox class="adf-checkbox" [id]="inputId()" [formField]="field()" [title]="definition().tooltip ?? ''">
        {{ definition().name | translate }}
        @if (definition().required) {
            <span class="adf-asterisk">*</span>
        }
    </mat-checkbox>
    @if (showError() && error(); as message) {
        <div class="adf-error-messages-container">
            <span class="adf-error-text">{{ message.key | translate: message.params }}</span>
        </div>
    }
</div>

<div class="adf-amount-widget__container adf-amount-widget" [class.adf-invalid]="showError()" [class.adf-readonly]="readOnly()">
    <adf-signal-amount-input
        labelAutomationId="adf-amount-widget-label"
        [formField]="field()"
        [inputId]="inputId()"
        [label]="definition().name || definition().required ? (definition().name ?? '' | translate) : undefined"
        [placeholder]="definition().placeholder ?? ''"
        [tooltip]="definition().tooltip ?? ''"
        [currency]="definition().currency"
        [enableFractions]="definition().enableFractions"
        [localeAmounts]="localeAmounts()"
        [error]="shownError()"
    />
</div>

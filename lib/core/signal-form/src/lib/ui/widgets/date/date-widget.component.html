<div class="adf-date-widget-container" [class.adf-invalid]="showError()" [class.adf-readonly]="readOnly()">
    <adf-signal-date-input
        labelAutomationId="adf-date-widget-label"
        [formField]="field()"
        [inputId]="inputId()"
        [label]="(definition().name | translate) + ' (' + definition().dateDisplayFormat + ')'"
        [placeholder]="definition().placeholder ?? ''"
        [tooltip]="definition().tooltip ?? ''"
        [displayFormat]="definition().dateDisplayFormat"
        [minDate]="range().min"
        [maxDate]="range().max"
        [error]="shownError()"
    />
</div>

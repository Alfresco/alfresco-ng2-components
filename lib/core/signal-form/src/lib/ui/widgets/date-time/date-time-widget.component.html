<div class="adf-date-time-widget-container" [class.adf-invalid]="showError()" [class.adf-readonly]="readOnly()">
    <adf-signal-date-time-input
        labelAutomationId="adf-date-time-widget-label"
        [formField]="field()"
        [inputId]="inputId()"
        [label]="definition().name | translate"
        [placeholder]="definition().placeholder ?? ''"
        [tooltip]="definition().tooltip ?? ''"
        [minDate]="range().min"
        [maxDate]="range().max"
        [error]="shownError()"
    />
</div>

<div [ngClass]="field.className"
     [class.adf-invalid]="!field.isValid && isTouched()"
     [class.adf-readonly]="field.readOnly || readOnly"
     class="adf-checkbox-widget-container"
>
    <mat-checkbox [id]="field.id"
                  class="adf-checkbox"
                  [required]="isRequired()"
                  [disabled]="field.readOnly || readOnly"
                  [(ngModel)]="field.value"
                  (ngModelChange)="onFieldChanged(field)"
                  [title]="field.tooltip"
                  (click)="markAsTouched()"
                  >
        {{ field.name | translate }}
        <span class="adf-asterisk" [style.visibility]="isRequired() ? 'visible' : 'hidden'">*</span>
    </mat-checkbox>
    <div class="adf-error-messages-container">
        <error-widget
            [error]="field.validationSummary"
            [required]="isInvalidFieldRequired() && isTouched() ? ('FORM.FIELD.REQUIRED' | translate) : ''"
        />
    </div>
</div>

<div [class.adf-readonly]="field?.readOnly">
    <button
        mat-flat-button
        class="adf-button-widget__button"
        [matTooltip]="$safeNavigationMigration(field?.tooltip)"
        [matTooltipShowDelay]="tooltipShowDelay"
        [disabled]="field?.readOnly ?? false"
        (click)="onClick($event)"
    >
        {{ $safeNavigationMigration(field?.name) | translate }}
    </button>
</div>

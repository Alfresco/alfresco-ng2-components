<div class="{{ field.className }} date-widget-container" id="data-widget"
     [class.adf-invalid]="hasValidationError() && dateInputControl.touched"
     [class.adf-readonly]="field.readOnly">
    <mat-form-field class="adf-date-widget adf-form-field-input" subscriptSizing="dynamic" [floatLabel]="field.placeholder ? 'always' : null">
        <mat-label class="adf-label" data-automation-id="adf-date-widget-label">
            {{ field.name | translate }} ({{ field.dateDisplayFormat }})
        </mat-label>
        <input matInput
               [matDatepicker]="datePicker"
               [id]="field.id"
               [formControl]="dateInputControl"
               [errorStateMatcher]="errorStateMatcher"
               [placeholder]="field.placeholder"
               [min]="minDate"
               [max]="maxDate"
               [required]="field.required && field.isVisible"
               [readonly]="field.readOnly"
        />
        <mat-datepicker-toggle matSuffix [for]="datePicker" [disabled]="field.readOnly" />
        <mat-datepicker #datePicker
                        [startAt]="startAt"
                        [disabled]="field.readOnly" />
        @if (hasValidationError() && dateInputControl.touched) {
            <mat-error class="adf-form-field-status-slot">
                <mat-icon class="adf-error-icon">error_outline</mat-icon>
                <span class="adf-error-text">@if (hasRequiredError()) {{{ 'FORM.FIELD.REQUIRED' | translate }}} @else {{{ field.validationSummary.message | translate: translateParameters }}}</span>
            </mat-error>
        }
        <mat-hint class="adf-form-field-status-slot" aria-hidden="true" />
    </mat-form-field>
</div>

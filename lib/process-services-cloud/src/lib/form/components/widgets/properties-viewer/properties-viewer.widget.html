<div class="adf-file-viewer-widget {{field.className}}" [class.adf-invalid]="!field.isValid" [class.adf-readonly]="field.readOnly">
    <label class="adf-label" [attr.for]="field.id"
        >{{field.name | translate }}<span class="adf-asterisk" [style.visibility]="isRequired() ? 'visible' : 'hidden'">*</span></label
    >
    <ng-template
        #properties
        [ngTemplateOutlet]="properties"
        let-properties="properties"
        [ngTemplateOutletContext]="{ properties: $safeNavigationMigration(field.params?.propertiesViewerOptions) }"
    >
        <adf-properties-viewer-wrapper
            *ngIf="field.value"
            [nodeId]="field.value"
            [displayDefaultProperties]="$safeNavigationMigration(properties?.displayDefaultProperties) !== undefined ?  $safeNavigationMigration(properties?.displayDefaultProperties) : true"
            [expanded]="$safeNavigationMigration(properties?.expanded) !== undefined ? $safeNavigationMigration(properties?.expanded) : true"
            [preset]="$safeNavigationMigration(properties?.preset)"
            [displayEmpty]="$safeNavigationMigration(properties?.displayEmpty) !== undefined ? $safeNavigationMigration(properties?.displayEmpty) : false"
            [editable]="$safeNavigationMigration(properties?.editable) !== undefined ? $safeNavigationMigration(properties?.editable) : false"
            [multi]="$safeNavigationMigration(properties?.multi) !== undefined ? $safeNavigationMigration(properties?.multi) : false"
            [displayAspect]="$safeNavigationMigration(properties?.displayAspect) !== undefined ? $safeNavigationMigration(properties?.displayAspect) : null"
            [copyToClipboardAction]="$safeNavigationMigration(properties?.copyToClipboardAction) !== undefined ? $safeNavigationMigration(properties?.copyToClipboardAction) : true"
            [displayCopyToClipboardIcon]="properties?.displayCopyToClipboardIcon ?? true"
            [useChipsForMultiValueProperty]="$safeNavigationMigration(properties?.useChipsForMultiValueProperty) !== undefined ? $safeNavigationMigration(properties?.useChipsForMultiValueProperty) : true"
            (nodeContentLoaded)="onNodeContentLoaded($event)"
        />
    </ng-template>
    <error-widget [error]="field.validationSummary" />
</div>
